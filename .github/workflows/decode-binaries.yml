name: Decode staged binaries
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Decode staging files into binaries and clean up
        run: |
          python3 << 'PY'
          import json, base64, pathlib, shutil
          staging = pathlib.Path("_staging")
          manifest = json.loads((staging / "manifest.json").read_text(encoding="utf-8"))
          for item in manifest:
              out = pathlib.Path(item["path"])
              out.parent.mkdir(parents=True, exist_ok=True)
              b64 = "".join((staging / part).read_text(encoding="ascii").strip() for part in item["parts"])
              data = base64.b64decode(b64)
              if len(data) != item["bytes"]:
                  raise SystemExit(f"size mismatch for {out}: got {len(data)}, expected {item['bytes']}")
              out.write_bytes(data)
              print(f"wrote {out} ({len(data)} bytes)")
          shutil.rmtree(staging)
          wf = pathlib.Path(".github/workflows/decode-binaries.yml")
          if wf.exists():
              wf.unlink()
          # remove empty workflow dirs if possible
          for d in [pathlib.Path(".github/workflows"), pathlib.Path(".github")]:
              if d.is_dir() and not any(d.iterdir()):
                  d.rmdir()
          print("staging and workflow removed")
          PY
      - name: Commit binaries to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Add binary site assets (images, font, videos)"
          git push
